name = "rotartsilib"
version = "0.1.0"
defaultTargets = ["app1", "app2", "build_blog", "build_book"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "main"

[[lean_lib]]
name = "Rotartsilib"


[[lean_exe]]
name = "app1"
root = "Executables.App1.Main"

[[lean_exe]]
name = "app2"
root = "Executables.App2.Main"

[[lean_lib]]
name = "VersoContent"

[[lean_exe]]
name = "build_blog"
root = "VersoContent.BlogMain"

[[lean_exe]]
name = "build_book"
root = "VersoContent.BookMain"
